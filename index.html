<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HIRO Portfolio</title>

<style>

/* ===== 全体 ===== */

body{
  margin:0;
  height:100vh;

  display:flex;

  background-image:url("background.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  font-family:sans-serif;
}

/* ===== サイドバー ===== */

.sidebar{

  width:250px;
  height:100vh;

  background:rgb(129, 129, 129);

  backdrop-filter:blur(5px);

  padding:20px;

  box-sizing:border-box;
}

.logo{

  color:white;

  text-align:center;

  font-size:28px;

  margin-bottom:30px;
}

/* ===== メニュー ===== */

.menu-btn{

  width:100%;

  padding:15px;

  margin-bottom:10px;

  border:none;

  border-radius:15px;

  background:#000d7e;

  color:white;

  font-size:16px;

  cursor:pointer;

  transition:0.15s;
}

.menu-btn:active{
  transform:scale(0.95);
}

/* ===== メイン ===== */

.main{
  flex:1;

  display:flex;

  justify-content:center;

  align-items:flex-start;

  padding-top:80px;
}

.card{

  background:rgba(255,255,255,0.92);

  padding:40px;

  border-radius:30px;

  max-width:700px;

  text-align:center;
}

.card h1{

  color:#000d7e;

  margin-top:0;
}

.card p{

  line-height:1.8;
}

/* ===== 作者 ===== */

.author{

  position:fixed;

  right:15px;

  bottom:15px;

  color:white;

  font-size:14px;
}

/* ===== スマホ ===== */

@media screen and (max-width:700px){

  .sidebar{

    width:170px;
  }

  .logo{

    font-size:22px;
  }

  .menu-btn{

    font-size:14px;
    padding:12px;
  }

  .card{

    padding:25px;
  }

}

</style>

</head>

<body>

<!-- サイドバー -->

<div class="sidebar">

  <div class="logo">
    OKM Portfolio
  </div>

  <button
    class="menu-btn"
    onclick="location.href='index.html'">

    HOME

  </button>

  <button
    class="menu-btn"
    onclick="location.href='sites.html'">

    サイト紹介

  </button>

  <button
    class="menu-btn"
    onclick="location.href='illustrations.html'">

    イラスト紹介

  </button>

</div>

<!-- メイン -->

<div class="main">

  <div class="card">

    <h1>
      OKM Portfolio
    </h1>

    <p>
      個人で制作したWebサイトや
      アプリを紹介するポートフォリオサイトです。
    </p>

    <p>
      JavaScriptやHTML/CSSを使った
      作品を掲載しています。
    </p>

  </div>

</div>

<div class="author">
  Author : HIRO
</div>

</body>

</html>
